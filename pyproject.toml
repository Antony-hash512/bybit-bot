[project]
name = "bybit-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Antony-hash512", email = "antony.ictr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pybit>=5.17.0",
    "pycryptodome>=3.23.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[project.scripts]
bybit-bot = "bybit_bot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
